{% extends "base.html" %}
{% block title %}AI 助手{% endblock %}

{% block head_extra %}
<style>
    .chat-container { max-width: 750px; margin: 0 auto; }
    .chat-messages {
        max-height: 500px;
        overflow-y: auto;
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: var(--radius-lg);
        padding: 20px;
        background: var(--card-glass);
        backdrop-filter: blur(12px);
        margin-bottom: 16px;
        box-shadow: var(--shadow-sm);
    }
    .chat-msg {
        margin-bottom: 14px;
        padding: 14px 18px;
        border-radius: var(--radius);
        font-size: 14px;
        line-height: 1.7;
    }
    .chat-msg.user {
        background: linear-gradient(135deg, #fef3c7 0%, #fef9ed 100%);
        border: 1px solid rgba(245,158,11,0.15);
    }
    .chat-msg.ai {
        background: linear-gradient(135deg, #eff6ff 0%, #f5f9ff 100%);
        border: 1px solid rgba(59,130,246,0.10);
    }
    .chat-msg .label {
        font-weight: 700;
        font-size: 12px;
        margin-bottom: 6px;
        letter-spacing: 0.3px;
    }
    .chat-msg.user .label { color: #d97706; }
    .chat-msg.ai .label { color: var(--blue); }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input-row input {
        flex: 1;
        padding: 12px 18px;
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: var(--radius-pill);
        font-size: 14px;
        font-family: inherit;
        background: var(--card-glass);
        backdrop-filter: blur(12px);
        outline: none;
        transition: all var(--transition-fast);
    }
    .chat-input-row input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(245,158,11,0.10);
    }
</style>
{% endblock %}

{% block content %}
<h1>🤖 AI 助手</h1>
<p class="page-subtitle">向 DeepSeek AI 提问，获取学业规划与简历优化建议</p>

<div class="chat-container">
    <div class="chat-messages" id="chatMessages">
        <div class="chat-msg ai">
            <div class="label">AI 助手</div>
            <div>你好！我是 PDPTool AI 助手，可以帮你分析学业数据、优化简历、准备面试。试试问：<br><br>
            • 分析一下我的 GPA 趋势<br>
            • 怎么提升简历的竞争力<br>
            • 面试中常见的算法题有哪些<br>
            • 帮我规划下学期的课程</div>
        </div>
    </div>

    <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    const container = document.getElementById('chatMessages');
    container.innerHTML += `<div class="chat-msg user"><div class="label">你</div><div>${escapeHtml(msg)}</div></div>`;
    input.value = '';
    input.disabled = true;

    const loadingId = 'loading_' + Date.now();
    container.innerHTML += `<div class="chat-msg ai" id="${loadingId}"><div class="label">AI 助手</div><div>思考中...</div></div>`;
    container.scrollTop = container.scrollHeight;

    try {
        const form = new FormData();
        form.append('message', msg);
        const resp = await fetch('/api/ai/chat', { method: 'POST', body: form });
        const data = await resp.json();
        document.getElementById(loadingId).innerHTML = `<div class="label">AI 助手</div><div>${escapeHtml(data.reply)}</div>`;
    } catch (e) {
        document.getElementById(loadingId).innerHTML = `<div class="label">AI 助手</div><div style="color:#ef4444;">请求失败: ${e.message}</div>`;
    }

    input.disabled = false;
    input.focus();
    container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
}
</script>
{% endblock %}
