{% extends "base.html" %}
{% block title %}AI 助手{% endblock %}

{% block head_extra %}
<style>
    .chat-container { max-width: 750px; margin: 0 auto; }
    .chat-messages { max-height: 500px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; background: var(--card-bg); margin-bottom: 16px; }
    .chat-msg { margin-bottom: 14px; padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 1.65; }
    .chat-msg.user { background: #fff8ec; border: 1px solid #f0d89c; }
    .chat-msg.ai { background: #f0f6ff; border: 1px solid #b8d4f8; }
    .chat-msg .label { font-weight: 700; font-size: 12px; margin-bottom: 4px; }
    .chat-msg.user .label { color: var(--orange); }
    .chat-msg.ai .label { color: var(--accent); }
    .chat-input-row { display: flex; gap: 10px; }
    .chat-input-row input { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    .chat-input-row button { padding: 10px 22px; }
</style>
{% endblock %}

{% block content %}
<h1>🤖 AI 助手</h1>
<p class="text-muted" style="margin-bottom:16px;">向 DeepSeek AI 提问，获取学业规划、简历优化、面试准备等建议。</p>

<div class="chat-container">
    <div class="chat-messages" id="chatMessages">
        <div class="chat-msg ai">
            <div class="label">AI 助手</div>
            <div>你好！我是 PDPTool AI 助手，可以帮你分析学业数据、优化简历、准备面试。试试问：<br><br>
            • 分析一下我的 GPA 趋势<br>
            • 怎么提升简历的竞争力<br>
            • 面试中常见的算法题有哪些<br>
            • 帮我规划下学期的课程</div>
        </div>
    </div>

    <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="输入你的问题..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button class="btn btn-primary" onclick="sendMessage()">发送</button>
    </div>
</div>

<script>
async function sendMessage() {
    const input = document.getElementById('chatInput');
    const msg = input.value.trim();
    if (!msg) return;

    const container = document.getElementById('chatMessages');
    container.innerHTML += `<div class="chat-msg user"><div class="label">你</div><div>${escapeHtml(msg)}</div></div>`;
    input.value = '';
    input.disabled = true;

    // Add loading indicator
    const loadingId = 'loading_' + Date.now();
    container.innerHTML += `<div class="chat-msg ai" id="${loadingId}"><div class="label">AI 助手</div><div>思考中...</div></div>`;
    container.scrollTop = container.scrollHeight;

    try {
        const form = new FormData();
        form.append('message', msg);
        const resp = await fetch('/api/ai/chat', { method: 'POST', body: form });
        const data = await resp.json();
        document.getElementById(loadingId).innerHTML = `<div class="label">AI 助手</div><div>${escapeHtml(data.reply)}</div>`;
    } catch (e) {
        document.getElementById(loadingId).innerHTML = `<div class="label">AI 助手</div><div style="color:#cd3131;">请求失败: ${e.message}</div>`;
    }

    input.disabled = false;
    input.focus();
    container.scrollTop = container.scrollHeight;
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
}
</script>
{% endblock %}
